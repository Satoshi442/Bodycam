name: Build Bodycam Motion

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Package
        run: |
          mkdir -p dist/BodycamMotion
          cp build/libBodycamMotion.so manifest.json README.md dist/BodycamMotion/

      - uses: actions/upload-artifact@v4
        with:
          name: BodycamMotion
          path: dist/BodycamMotion/
          
